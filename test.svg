<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
    width="800" height="600"
    viewBox="0 0 800 600">
    
  <rect width="100%" height="100%" fill="#FFFFFF"/>
    
    <rect x="40" y="40" width="720" height="600" fill="none" stroke="#008000" stroke-width="1"/>
    <line x1="760.0" y1="40" x2="760.0" y2="560" stroke="#800000" stroke-width="1"/>
    
<text x="40" y="75.2" font-family="sans-serif" font-size="32.0" fill="#222222" text-anchor="start"><tspan font-weight="bold">J4T Installation</tspan></text>
  <text x="40" y="105.60000000000001" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>1.  </tspan><tspan>Go to your &quot;Home Screen&quot; (Swipe up from the bottom of your phone)</tspan></text>
  <text x="40" y="129.60000000000002" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>2.  </tspan><tspan>In the search box, enter &quot;Play Store&quot; to search for the &quot;Play Store&quot; App (which is a short name</tspan></text>
  <text x="40" y="153.60000000000002" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>    </tspan><tspan>for Application)</tspan></text>
  <text x="40" y="177.60000000000002" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>3.  </tspan><tspan>Click on the &quot;Play Store&quot; icon</tspan></text>
  <text x="40" y="201.60000000000002" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>4.  </tspan><tspan>Click on the &quot;Search&quot; icon at the bottom of the app (the magnifying glass)</tspan></text>
  <text x="40" y="225.60000000000002" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>5.  </tspan><tspan>At the top of the screen in the text area, enter &quot;J4T Multitrack&quot;</tspan></text>
  <text x="40" y="249.60000000000002" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>6.  </tspan><tspan>At the bottom right of the screen, where the keyboard is, click on the</tspan></text>
  <text x="40" y="273.6" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>magnifying glass to search for the application</tspan></text>
  <text x="40" y="302.40000000000003" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>1.  </tspan><tspan>Look for the picture of the J4T Multitrack Recorder and click on the</tspan></text>
  <text x="40" y="326.40000000000003" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>installation button, it will probably show a price; if you already have it,</tspan></text>
  <text x="40" y="350.40000000000003" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>it will say &quot;Install&quot; like mine does.</tspan></text>
  <text x="40" y="379.20000000000005" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>1.  </tspan><tspan>Once it has finished installing, the button will change to &quot;Open&quot;</tspan></text>
  <text x="40" y="403.20000000000005" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>2.  </tspan><tspan>If you would like, you can click on that to open the application</tspan></text>
  <text x="40" y="427.20000000000005" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>3.  </tspan><tspan>If you swipe up from the bottom, you will go back to your home screen</tspan></text>
  <text x="40" y="451.20000000000005" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>4.  </tspan><tspan>The application should have installed to your home screen, and you can now</tspan></text>
  <text x="40" y="475.20000000000005" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start"><tspan>find it by the icon</tspan></text>
</svg>
